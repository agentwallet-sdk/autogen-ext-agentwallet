[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autogen-ext-agentwallet"
version = "1.0.0"
description = "Non-custodial wallet extension for AutoGen agents — EVM + Solana, x402 payments, CCTP bridge, on-chain spend limits"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AI Agent Economy", email = "max@ai-agent-economy.com"}]
keywords = ["autogen", "wallet", "agent", "evm", "solana", "x402", "cctp", "non-custodial", "payments"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "autogen-core>=0.4.0",
    "web3>=6.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://ai-agent-economy.com"
Repository = "https://github.com/agentwallet-sdk/autogen-ext-agentwallet"

[tool.setuptools.packages.find]
where = ["src"]
